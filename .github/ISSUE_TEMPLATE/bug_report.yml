name: Bug report
description: Something in Lidless is not working as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click the menu bar icon
        2. Close the lid
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lidless version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac type
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: textarea
    id: pmset
    attributes:
      label: Output of `pmset -g`
      render: text
