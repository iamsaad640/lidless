name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swiftc --version

      - name: Build universal app
        run: make build

      - name: Verify architectures
        run: lipo -archs build/Lidless.app/Contents/MacOS/Lidless

      - name: Package
        run: make dist
